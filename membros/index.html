<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Área de Membros · Natal 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f11;--side:#141417;--card:#18181c;--card2:#1e1e23;--line:#2a2a31;--txt:#ececf1;--mut:#9a9aa6;--or:#ff7a1a;--or2:#ffa04d;--ok:#22c55e;--red:#ef4444}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font-family:Lexend,system-ui,sans-serif;font-size:15px;line-height:1.55}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:Poppins,sans-serif;line-height:1.2}
.app{display:flex;min-height:100vh}
aside{width:250px;background:var(--side);border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:20;transition:transform .25s}
.brand{font-family:Poppins;font-weight:800;font-size:21px;padding:0 10px 22px;letter-spacing:-.3px}.brand span{color:var(--or)}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#cfcfd6;font-weight:600;margin-bottom:3px;font-size:15px}
nav a:hover{background:#1c1c21}
nav a.on{background:rgba(255,122,26,.13);color:var(--or)}
nav a .i{width:22px;text-align:center}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;font-size:13px;color:var(--mut)}
main{margin-left:250px;flex:1;padding:36px 34px 60px;max-width:1160px}
.eyebrow{color:var(--or);font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px}
.ph h1{font-size:30px}.ph p{color:var(--mut);margin-top:4px}
.ph{margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.box.hl{border-color:rgba(255,122,26,.55)}
.box h2{font-size:21px;margin-bottom:10px}.box h3{font-size:16px;margin-bottom:6px}
.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.mini{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px}
.mini ul{padding-left:18px;color:#c9c9d2}.mini li{margin:3px 0}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
.stat b{display:block;font-family:Poppins;font-size:30px;color:var(--or)}.stat span{color:var(--mut);font-size:13px}
ol.steps{padding-left:20px}ol.steps li{margin:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--or);color:#1a0d02;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-family:inherit;font-size:14px;text-transform:uppercase;letter-spacing:.3px}
.btn:hover{background:var(--or2)}
.btn.ghost{background:#202026;color:var(--txt);border:1px solid var(--line);text-transform:none}
.tip{background:rgba(255,122,26,.08);border:1px solid rgba(255,122,26,.35);border-radius:12px;padding:12px 14px;color:#e8d6c6;font-size:14px;margin-top:12px}
input,select{width:100%;background:#202026;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font-family:inherit;font-size:15px}
input:focus,select:focus{outline:none;border-color:var(--or)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.field{margin-bottom:14px}
.sec-t{color:var(--or);font-weight:700;font-size:12px;letter-spacing:1px;margin:4px 0 12px;text-transform:uppercase}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.15s}
.cat:hover{border-color:var(--or);transform:translateY(-2px)}
.cat .e{font-size:28px}.cat h3{font-size:16px;margin:8px 0 2px}.cat small{color:var(--mut)}
.cat.vazia{opacity:.5;cursor:default}.cat.vazia:hover{transform:none;border-color:var(--line)}
.sec{margin-top:30px}.sec-h h2{font-size:20px;margin:0 0 12px}.sec-h small{color:var(--mut);font-weight:400;font-size:13px}
.sec .items .item:nth-child(n+13){display:none}.sec.aberta .items .item:nth-child(n+13),body.buscando .sec .items .item:nth-child(n+13){display:flex}
body.buscando .sec-mais{display:none}.sec-mais{margin:14px auto 0;display:block}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.item img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#222;display:block}
.bimg{position:relative}.bimg img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#222;display:block}
.bn .bimg img{object-fit:cover;aspect-ratio:3/2}
.trav .bimg img{filter:grayscale(.6) brightness(.55)}
.cad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;text-shadow:0 4px 14px #000}
.item .b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{background:var(--or);color:#1a0d02;font-weight:700;font-size:11px;border-radius:999px;padding:2px 9px}
.ver{color:var(--ok);font-weight:700;font-size:11px;letter-spacing:.5px}
.item h3{font-size:15px}.item p{color:var(--mut);font-size:12px}
.item .btn{margin-top:auto;width:100%;text-align:center}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{max-width:280px}
.res{font-size:14px}.res .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.res .big{font-family:Poppins;font-size:34px;color:var(--ok);margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tabs button{background:#1c1c21;border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 16px;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--or);color:#1a0d02;border-color:var(--or);font-weight:700}
.prog{height:10px;background:#26262c;border-radius:99px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--or)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.login h1{font-size:26px;margin:14px 0 6px}.login p{color:var(--mut)}
.login .btn{width:100%;margin-top:12px;padding:14px;font-size:15px}
.err{color:#fca5a5;font-size:14px;margin-top:10px;min-height:20px}
.lock{opacity:.55}
.btn.wa{background:#22c55e;color:#062b12}
.top{display:none}
@media(max-width:900px){.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:760px){
 aside{transform:translateX(-100%)}aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
 main{margin-left:0;padding:76px 16px 50px}
 .top{display:flex;position:fixed;top:0;left:0;right:0;height:58px;background:var(--side);border-bottom:1px solid var(--line);align-items:center;gap:12px;padding:0 16px;z-index:15}
 .top button{background:none;border:0;color:var(--txt);font-size:24px}
 .g3,.g4{grid-template-columns:1fr}.ph h1{font-size:25px}
 .items{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="login" class="login" style="display:none"></div>
<div id="app" style="display:none">
<div class="top"><button onclick="menu()" aria-label="Menu">☰</button><div class="brand" style="padding:0">NATAL <span>3D</span></div></div>
<div class="app">
<aside id="side">
  <div class="brand">NATAL <span>3D</span></div>
  <nav id="nav"></nav>
  <div class="side-foot"><div id="quem" style="word-break:break-all"></div><a href="#" onclick="sair();return false" style="color:var(--or);font-weight:600">Sair</a></div>
</aside>
<main id="main"></main>
</div>
</div>
<script src="/membros/itens.js?v=6"></script>
<script src="/membros/pack.js?v=1"></script>
<script src="/membros/reveillon.js?v=1"></script>
<script>
window.CATEGORIAS=window.CATEGORIAS||[];window.ITENS=window.ITENS||[];window.SECOES=window.SECOES||[];window.PACK=window.PACK||[];
var PAGES=[['comece','📌','Comece aqui'],['guia','🎓','Guia do Iniciante'],['arquivos','📦','Arquivos STL'],['calc','🧮','Calculadora'],['painel','📈','Painel de vendas'],['bonus','🎁','Bônus'],['loja','⭐','Adicionais'],['licenca','🛡️','Licença de uso'],['suporte','✉️','Suporte']];
var SUP='digitalsuporte38@gmail.com';
function $(s){return document.querySelector(s)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function menu(){$('#side').classList.toggle('open')}
function cnt(id){return ITENS.filter(function(i){return i.cat===id}).length}
function head(e,t,p,extra){return '<div class="ph"><div><div class="eyebrow">'+e+'</div><h1>'+t+'</h1><p>'+p+'</p></div>'+(extra||'')+'</div>'}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('n3d_'+k)||'null');localStorage.setItem('n3d_'+k,JSON.stringify(v))}catch(e){return null}}
function brl(v){return 'R$ '+(isFinite(v)?v:0).toFixed(2).replace('.',',')}

var V={};
V.comece=function(){return head('Leia antes de começar','Bem-vindo! 👋','1 minuto de leitura pra você saber o que tem aqui e por onde começar.')+
'<div class="box hl"><h2>O que tem nesta área</h2><p>Arquivos STL de Natal prontos para imprimir, separados por categoria, mais as ferramentas para você calcular o preço e acompanhar as vendas.</p>'+
'<div class="grid g3" style="margin-top:14px"><div class="mini"><h3>✅ O que você recebe</h3><ul><li>Arquivos organizados por categoria</li><li>Guia do arquivo à peça pronta</li><li>Calculadora de custo e preço</li><li>Painel para anotar suas vendas</li></ul></div>'+
'<div class="mini"><h3>🖥️ Do que você precisa</h3><ul><li>Uma impressora 3D (qualquer FDM)</li><li>Um computador para abrir os arquivos</li><li>Um fatiador gratuito (Bambu Studio, OrcaSlicer, Cura...)</li></ul></div>'+
'<div class="mini"><h3>💡 Dica</h3><ul><li>Comece pelas peças pequenas e planas</li><li>Imprima amostras e tire fotos</li><li>Divulgue antes de dezembro</li></ul></div></div></div>'+
'<div class="box"><div class="eyebrow">O que você já tem nas mãos</div><div class="grid g4" style="margin-top:8px"><div class="stat"><b>'+ITENS.length+'</b><span>modelos liberados até agora</span></div><div class="stat"><b>ZIP</b><span>pronto pra extrair e fatiar</span></div><div class="stat"><b>∞</b><span>acesso vitalício</span></div><div class="stat"><b>2</b><span>ferramentas: calculadora e painel</span></div></div>'+
'<p class="hint" style="margin-top:10px">Novos modelos são adicionados aos poucos. Volte aqui de vez em quando.</p></div>'+
'<div class="box"><div class="eyebrow">Sua primeira vitória hoje</div><h2>Faça isso nas próximas 24 horas</h2><ol class="steps"><li>Abra <b>Arquivos STL</b> e escolha 3 peças pequenas.</li><li>Imprima a primeira e anote o peso e o tempo na <b>Calculadora</b>.</li><li>Tire uma foto bonita da peça com fundo limpo e luz natural.</li><li>Poste no Instagram ou no status do WhatsApp com o preço.</li><li>Anote cada venda no <b>Painel de vendas</b>.</li></ol><div style="margin-top:14px"><a class="btn" href="#arquivos">Ver os arquivos</a></div></div>'};

V.guia=function(){return head('Guia do Iniciante','Do arquivo à peça pronta 🎓','Nunca imprimiu um arquivo baixado? Siga na ordem. Leva uns 10 minutos.')+
'<div class="box"><div class="eyebrow">Passo 1</div><h2>Entenda os arquivos</h2><div class="grid g3"><div class="mini"><h3>📦 .ZIP</h3>Pasta compactada. Clique com o botão direito e em <b>Extrair</b> antes de abrir.</div><div class="mini"><h3>🧊 .STL</h3>O formato da peça. Abre em qualquer fatiador; você escolhe cor e configuração.</div><div class="mini"><h3>🎨 .3MF</h3>Projeto pronto, às vezes com várias peças e cores já organizadas.</div></div><div class="tip">📱 Pelo celular você só baixa. Para imprimir, abra o arquivo num programa no <b>computador</b>.</div></div>'+
'<div class="box"><div class="eyebrow">Passo 2</div><h2>Instale o programa da sua impressora</h2><p>A impressora não lê o STL direto: antes ele passa por um <b>fatiador</b>, que transforma a peça em camadas. Todos estes são grátis:</p><div class="grid g4" style="margin-top:12px"><div class="mini"><h3>Bambu Lab</h3>Bambu Studio</div><div class="mini"><h3>Creality</h3>Creality Print ou OrcaSlicer</div><div class="mini"><h3>Elegoo, Anycubic, Sovol</h3>OrcaSlicer ou o programa da marca</div><div class="mini"><h3>Prusa e outras</h3>PrusaSlicer ou UltiMaker Cura</div></div></div>'+
'<div class="box"><div class="eyebrow">Passo 3</div><h2>Primeira impressão, passo a passo</h2><ol class="steps"><li>Baixe e extraia o ZIP.</li><li>Abra o fatiador e arraste o arquivo .STL para dentro.</li><li>Escolha a sua impressora e o filamento (comece com <b>PLA</b>).</li><li>Clique em <b>Fatiar</b>. Veja o tempo e o peso que aparecem.</li><li>Envie para a impressora (Wi-Fi, cartão SD ou cabo) e acompanhe a primeira camada.</li></ol></div>'+
'<div class="box"><div class="eyebrow">Passo 4</div><h2>Configurações seguras para começar</h2><div class="grid g3"><div class="mini"><h3>Altura de camada</h3>0,2 mm</div><div class="mini"><h3>Paredes</h3>2 a 3</div><div class="mini"><h3>Preenchimento</h3>15% (peças planas) a 20%</div></div><div class="tip">Peças planas (letreiros, enfeites, tags, flocos) imprimem <b>sem suporte</b>. Figuras em pé podem precisar de suporte em algumas partes.</div></div>'+
'<div class="box"><div class="eyebrow">Passo 5</div><h2>Deu problema? Soluções rápidas</h2><table><tr><th>Problema</th><th>O que fazer</th></tr><tr><td>Peça soltou da mesa</td><td>Limpe a mesa com álcool isopropílico e use borda (brim).</td></tr><tr><td>Fios entre as partes</td><td>Seque o filamento e ative a retração.</td></tr><tr><td>Primeira camada falhando</td><td>Nivele a mesa e confira a altura do bico.</td></tr><tr><td>Peça empenada nas pontas</td><td>Use borda e evite vento ou ar-condicionado perto.</td></tr></table></div>'+
'<div class="box"><div class="eyebrow">Passo 6</div><h2>Duas cores sem impressora multicor</h2><p>No fatiador, adicione uma <b>pausa na camada</b> em que a cor muda (por exemplo, onde começa o texto). Quando a impressora pausar, troque o filamento e continue. Ótimo para letreiros e enfeites com nome.</p></div>'};

var catAtual=null;
V.arquivos=function(){
 return head('Biblioteca','Arquivos STL','Modelos de Natal prontos pra fatiar. Novos arquivos entram aos poucos.','<input class="search" id="q" placeholder="Buscar modelo..." oninput="filtra()">')+
 '<div class="box hl" style="display:flex;align-items:center;gap:14px;padding:16px 18px"><div style="font-size:26px">🎄</div><div><h3 style="margin:0">Natal <small style="color:var(--mut);font-weight:400">'+ITENS.length+' arquivo(s)</small></h3><p style="color:var(--mut);font-size:13px">Clique em <b>Acesso ao arquivo</b> para baixar o ZIP. Depois extraia e abra no seu fatiador.</p></div></div>'+
 '<div class="items" id="its">'+ITENS.map(card).join('')+'</div>'+(ITENS.length?'':'<div class="box">Em breve novos modelos.</div>')+secoes()};
function tem(x){return (USER.extras||[]).indexOf(x)>-1}
function temPack(i){return USER.plano==='completo'||(i.s==='enfeites_com_nome'&&tem('nomes'))}
function cardP(i){var ok=temPack(i);return '<div class="item'+(ok?'':' trav')+'" data-n="'+esc(i.n.toLowerCase())+'"><div class="bimg"><img src="/membros/fotos/pack/'+esc(i.f)+'.webp" alt="'+esc(i.n)+'" loading="lazy" style="object-fit:contain;background:#14301f">'+(ok?'':'<span class="cad">🔒</span>')+'</div><div class="b"><div class="tags"><span class="ver">✓ PRONTO P/ FATIAR</span></div><h3>'+esc(i.n)+'</h3>'+(ok?'<a class="btn" href="'+esc(dl('pack/'+i.f+'.zip'))+'">Baixar arquivo</a>':'<a class="btn ghost" href="'+UPGRADE+'" target="_blank" rel="noopener">🔒 Pacote Completo</a>')+'</div></div>'}
function secoes(){if(!PACK.length)return '';return secRV()+(USER.plano==='completo'?'':'<div class="box hl" style="margin-top:30px"><h2>🔒 Pack +1000 arquivos · Pacote Completo</h2><p>As seções abaixo fazem parte do Pacote Completo, junto com os 5 bônus. Faça o upgrade com o mesmo e-mail da compra e o download é liberado aqui na hora.</p><div style="margin-top:14px"><a class="btn" href="'+UPGRADE+'" target="_blank" rel="noopener">Liberar o pack +1000 e os bônus</a></div>'+(tem('nomes')?'<p class="hint" style="margin-top:8px">✅ Seu adicional <b>Enfeites com Nome</b> já está liberado abaixo.</p>':'')+'</div>')+SECOES.map(function(s){var its=PACK.filter(function(i){return i.s===s.id});if(!its.length)return '';
 return '<div class="sec" id="sec-'+s.id+'"><div class="sec-h"><h2>'+s.ico+' '+esc(s.nome)+' <small>'+its.length+' arquivos</small></h2></div><div class="items">'+its.map(cardP).join('')+'</div>'+(its.length>12?'<button class="btn sec-mais" onclick="this.parentNode.classList.add(\'aberta\');this.remove()">Ver todos os '+its.length+'</button>':'')+'</div>'}).join('')}
function card(i){var href=i.link||dl('arquivos/'+i.arq);var at=i.link?' target="_blank" rel="noopener"':'';
 if(USER.plano==='adicional')return '<div class="item trav" data-n="'+esc(i.nome.toLowerCase())+'"><div class="bimg"><img src="/membros/fotos/'+esc(i.foto)+'" alt="'+esc(i.nome)+'" loading="lazy"><span class="cad">🔒</span></div><div class="b"><h3>'+esc(i.nome)+'</h3><a class="btn ghost" href="'+BASICO+'" target="_blank" rel="noopener">🔒 Pack Natal 3D</a></div></div>';
 return '<div class="item" data-n=""'+esc(i.nome.toLowerCase())+'"><img src="/membros/fotos/'+esc(i.foto)+'" alt="'+esc(i.nome)+'" loading="lazy"><div class="b"><div class="tags">'+(i.novo?'<span class="tag">✨ NOVO</span>':'')+'<span class="ver">✓ PRONTO P/ FATIAR</span></div><h3>'+esc(i.nome)+'</h3>'+(i.info?'<p>'+esc(i.info)+'</p>':'')+'<a class="btn" href="'+esc(href)+'"'+at+'>Acesso ao arquivo</a></div></div>'}
function cardRV(i){return '<div class="item" data-n="'+esc(i.n.toLowerCase())+'"><div class="bimg"><img src="/membros/fotos/reveillon/'+esc(i.f)+'.webp" alt="'+esc(i.n)+'" loading="lazy" style="object-fit:contain;background:#14301f"></div><div class="b"><div class="tags"><span class="tag">✨ NOVO</span><span class="ver">✓ PRONTO P/ FATIAR</span></div><h3>'+esc(i.n)+'</h3><a class="btn" href="'+esc(dl('reveillon/'+i.f+'.zip'))+'">Baixar arquivo</a></div></div>'}
function secRV(){if(!tem('reveillon')||!window.RV)return '';return '<div class="sec" id="sec-reveillon"><div class="sec-h"><h2>🥂 Pack Réveillon 2027 <small>'+RV.length+' arquivos · adicional</small></h2></div><div class="items">'+RV.map(cardRV).join('')+'</div></div>'}
function filtra(){var q=$('#q').value.toLowerCase();document.querySelectorAll('#its .item').forEach(function(e){e.style.display=e.dataset.n.indexOf(q)>-1?'':'none'});
 document.body.classList.toggle('buscando',!!q);document.querySelectorAll('.sec').forEach(function(s){var n=0;s.querySelectorAll('.item').forEach(function(e){var ok=e.dataset.n.indexOf(q)>-1;e.style.display=ok?'':'none';if(ok)n++});s.style.display=(q&&!n)?'none':''})}
function buscaGeral(){var q=$('#qg').value.toLowerCase().trim();var b=$('#busca');if(!q){b.innerHTML='';$('#cats').style.display='';return}
 var r=ITENS.filter(function(i){return i.nome.toLowerCase().indexOf(q)>-1});$('#cats').style.display='none';
 var rp=PACK.filter(function(i){return i.n.toLowerCase().indexOf(q)>-1});
 b.innerHTML='<p style="margin-bottom:12px;color:var(--mut)">'+(r.length+rp.length)+' resultado(s)</p><div class="items">'+r.map(card).join('')+rp.slice(0,60).map(cardP).join('')+'</div>'}
